[package]
name = "radii-app"
version = "1.0.0"
description = "A Radii Office app in its own desktop window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
