<!DOCTYPE html>
<html lang="en">
<head>
    <script src="radii-file.js?v=20261042"></script>
    <script>RadiiFile.scope(/^(imbuer-book-v2$|imbuer-sheet-v1$|imbuer_collab_backup$)/);</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imbuer - Radii Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="keydown.css?v=20261131r">
    <link rel="stylesheet" href="marketplace-packs.css">
    <link rel="stylesheet" href="style.css?v=20261018c">
    <link rel="stylesheet" href="radii-collab.css?v=20261042">
    <link rel="icon" type="image/png" sizes="96x96" href="/imbuer/favicon-96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<!-- Classic layout: drifting gel orbs behind the glass! -->
<div id="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<!-- Classic layout: the original Imbuer glass sidebar! -->
<nav id="classic-side" class="aero-sidebar" aria-label="Imbuer sidebar">
    <div class="side-brand"><img src="favicon-96.png" alt=""><h2>Imbuer</h2></div>
    <div class="pad-stack">
        <button class="pad-btn" data-cmd="newBlank"><i data-ico="newDoc"></i>New</button>
        <button class="pad-btn" data-cmd="openFile"><i data-ico="folder"></i>Open .ks</button>
        <button class="pad-btn" data-cmd="saveCopy"><i data-ico="save"></i>Export .ks</button>
        <button class="pad-btn" data-cmd="templates"><i data-ico="sparkle"></i>Templates</button>
    </div>
    <div class="side-label">Sheet</div>
    <div class="pad-stack">
        <button class="pad-btn" data-cmd="insertRows"><i data-ico="plus"></i>Add Row</button>
        <button class="pad-btn" data-cmd="insertCols"><i data-ico="plus"></i>Add Column</button>
        <button class="pad-btn" data-cmd="deleteRows"><i data-ico="minus"></i>Delete Row</button>
        <button class="pad-btn" data-cmd="deleteCols"><i data-ico="minus"></i>Delete Column</button>
        <button class="pad-btn" data-cmd="chartColumn"><i data-ico="chartColumn"></i>Chart</button>
    </div>
    <div class="side-foot">
        <button class="side-act" data-cmd="help"><i data-ico="help"></i>Help Deck</button>
        <button class="side-act" data-cmd="settings"><i data-ico="gear"></i>Settings</button>
    </div>
    <button id="side-latch" data-cmd="toggleSide" title="Collapse the sidebar"><i data-ico="arrowL"></i></button>
</nav>

<div id="app">

    <!-- Title bar -->
    <header id="titlebar">
        <div class="tb-left">
            <img class="tb-logo" src="favicon-96.png" alt="">
            <div class="qat">
                <button class="qbtn" data-cmd="save" title="Save (⌘S)"><i data-ico="save"></i></button>
                <button class="qbtn" data-cmd="undo" title="Undo (⌘Z)"><i data-ico="undo"></i></button>
                <button class="qbtn" data-cmd="redo" title="Redo (⌘⇧Z)"><i data-ico="redo"></i></button>
            </div>
            <span class="tb-brand">Imbuer</span>
        </div>
        <div class="tb-title">
            <input id="book-name" spellcheck="false" aria-label="Workbook name">
            <span id="save-state" class="tb-saved">Saved</span>
        </div>
        <div class="tb-right">
            <div class="cmd-search">
                <i data-ico="search"></i>
                <input id="cmd-search" placeholder="Search for tools, help and more (⌘K)" spellcheck="false" autocomplete="off">
                <div id="cmd-results" class="menu" hidden></div>
            </div>
            <button class="qbtn" data-cmd="settings" title="Settings"><i data-ico="gear"></i></button>
        </div>
    </header>

    <!-- Ribbon tabs -->
    <nav id="ribbon-tabs" role="tablist">
        <button class="rtab file" data-tab="file">File</button>
        <button class="rtab on" data-tab="home">Home</button>
        <button class="rtab" data-tab="insert">Insert</button>
        <button class="rtab" data-tab="formulas">Formulae</button>
        <button class="rtab" data-tab="data">Data</button>
        <button class="rtab" data-tab="view">View</button>
        <button class="rtab" data-tab="help">Help</button>
        <span id="tab-ink"></span>
        <button class="rtab-collapse" data-cmd="toggleRibbon" title="Collapse the ribbon"><i data-ico="chevUp"></i></button>
    </nav>

    <!-- Ribbon -->
    <section id="ribbon">
        <!-- HOME -->
        <div class="rpanel on" data-panel="home">
            <div class="rgroup">
                <div class="rg-body">
                    <div class="split big">
                        <button class="rb big" data-cmd="paste" title="Paste (⌘V)"><i data-ico="paste"></i><span>Paste</span></button>
                        <button class="split-arrow" data-menu="paste" title="Paste options">▾</button>
                    </div>
                    <div class="stack">
                        <button class="rb sm" data-cmd="cut" title="Cut (⌘X)"><i data-ico="cut"></i><span>Cut</span></button>
                        <button class="rb sm" data-cmd="copy" title="Copy (⌘C)"><i data-ico="copy"></i><span>Copy</span></button>
                        <button class="rb sm" data-cmd="painter" title="Format Painter: copy formatting to other cells (double-click to keep it on)"><i data-ico="brush"></i><span>Format Painter</span></button>
                    </div>
                </div>
                <div class="rg-label">Clipboard</div>
            </div>

            <div class="rgroup">
                <div class="rg-body col">
                    <div class="row">
                        <div class="combo" id="font-combo" title="Font">
                            <input id="font-name" spellcheck="false" autocomplete="off">
                            <button class="combo-arrow" data-menu="fonts">▾</button>
                        </div>
                        <div class="combo narrow" id="size-combo" title="Font Size">
                            <input id="font-size" spellcheck="false" autocomplete="off">
                            <button class="combo-arrow" data-menu="sizes">▾</button>
                        </div>
                        <button class="rb ic" data-cmd="growFont" title="Increase Font Size"><i data-ico="growFont"></i></button>
                        <button class="rb ic" data-cmd="shrinkFont" title="Decrease Font Size"><i data-ico="shrinkFont"></i></button>
                    </div>
                    <div class="row">
                        <button class="rb ic" data-cmd="bold" title="Bold (⌘B)"><b class="glyph">B</b></button>
                        <button class="rb ic" data-cmd="italic" title="Italic (⌘I)"><i class="glyph it">I</i></button>
                        <button class="rb ic" data-cmd="underline" title="Underline (⌘U)"><u class="glyph">U</u></button>
                        <button class="rb ic" data-cmd="strike" title="Strikethrough (⌘⇧X)"><s class="glyph">ab</s></button>
                        <span class="rsep"></span>
                        <div class="split ic">
                            <button class="rb ic" data-cmd="borderBottom" title="Borders"><i data-ico="borders"></i></button>
                            <button class="split-arrow" data-menu="borders">▾</button>
                        </div>
                        <div class="split ic">
                            <button class="rb ic color-btn" data-cmd="fillColor" title="Fill Color"><i data-ico="bucket"></i><b class="cbar" id="fill-bar"></b></button>
                            <button class="split-arrow" data-menu="fillColor">▾</button>
                        </div>
                        <div class="split ic">
                            <button class="rb ic color-btn" data-cmd="fontColor" title="Font Color"><b class="glyph">A</b><b class="cbar" id="font-bar"></b></button>
                            <button class="split-arrow" data-menu="fontColor">▾</button>
                        </div>
                    </div>
                </div>
                <div class="rg-label">Font</div>
            </div>

            <div class="rgroup">
                <div class="rg-body col">
                    <div class="row">
                        <button class="rb ic" data-cmd="alignTop" title="Top Align"><i data-ico="vTop"></i></button>
                        <button class="rb ic" data-cmd="alignMiddle" title="Middle Align"><i data-ico="vMid"></i></button>
                        <button class="rb ic" data-cmd="alignBottom" title="Bottom Align"><i data-ico="vBot"></i></button>
                        <span class="rsep"></span>
                        <button class="rb sm" data-cmd="wrap" title="Wrap Text"><i data-ico="wrap"></i><span>Wrap Text</span></button>
                    </div>
                    <div class="row">
                        <button class="rb ic" data-cmd="alignLeft" title="Align Left"><i data-ico="aLeft"></i></button>
                        <button class="rb ic" data-cmd="alignCenter" title="Center"><i data-ico="aCenter"></i></button>
                        <button class="rb ic" data-cmd="alignRight" title="Align Right"><i data-ico="aRight"></i></button>
                        <span class="rsep"></span>
                        <button class="rb ic" data-cmd="outdent" title="Decrease Indent"><i data-ico="outdent"></i></button>
                        <button class="rb ic" data-cmd="indent" title="Increase Indent"><i data-ico="indent"></i></button>
                    </div>
                </div>
                <div class="rg-label">Alignment</div>
            </div>

            <div class="rgroup">
                <div class="rg-body col">
                    <div class="row">
                        <div class="combo wide" id="fmt-combo" title="Number Format">
                            <input id="fmt-name" readonly>
                            <button class="combo-arrow" data-menu="numFormats">▾</button>
                        </div>
                    </div>
                    <div class="row">
                        <button class="rb ic" data-cmd="fmtCurrency" title="Currency"><b class="glyph">$</b></button>
                        <button class="rb ic" data-cmd="fmtPercent" title="Percent Style (⌘⇧%)"><b class="glyph">%</b></button>
                        <button class="rb ic" data-cmd="fmtComma" title="Comma Style"><b class="glyph">,</b></button>
                        <span class="rsep"></span>
                        <button class="rb ic" data-cmd="decMore" title="Increase Decimal"><i data-ico="decMore"></i></button>
                        <button class="rb ic" data-cmd="decLess" title="Decrease Decimal"><i data-ico="decLess"></i></button>
                    </div>
                </div>
                <div class="rg-label">Number</div>
            </div>

            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-menu="condFormat" title="Conditional Formatting"><i data-ico="condFormat"></i><span>Conditional<br>Formatting ▾</span></button>
                    <button class="rb big" data-menu="tableStyles" title="Format as Table"><i data-ico="table"></i><span>Format as<br>Table ▾</span></button>
                    <button class="rb big" data-menu="cellStyles" title="Cell Styles"><i data-ico="cellStyles"></i><span>Cell<br>Styles ▾</span></button>
                    <button class="rb big kd-btn" data-cmd="keydownCells" title="Keydown Styles: gel orbs, chips and effects for the selected cells"><i data-ico="sparkle"></i><span>Keydown<br>Styles</span></button>
                </div>
                <div class="rg-label">Styles</div>
            </div>

            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-menu="insertCells" title="Insert"><i data-ico="insertRow"></i><span>Insert ▾</span></button>
                    <button class="rb big" data-menu="deleteCells" title="Delete"><i data-ico="deleteRow"></i><span>Delete ▾</span></button>
                    <button class="rb big" data-menu="formatCells" title="Format"><i data-ico="format"></i><span>Format ▾</span></button>
                </div>
                <div class="rg-label">Cells</div>
            </div>

            <div class="rgroup">
                <div class="rg-body">
                    <div class="stack">
                        <div class="split sm">
                            <button class="rb sm" data-cmd="autoSum" title="AutoSum (⌥=)"><b class="glyph sigma">Σ</b><span>AutoSum</span></button>
                            <button class="split-arrow" data-menu="autoSum">▾</button>
                        </div>
                        <button class="rb sm" data-menu="fill" title="Fill"><i data-ico="fillDown"></i><span>Fill ▾</span></button>
                        <button class="rb sm" data-menu="clear" title="Clear"><i data-ico="eraser"></i><span>Clear ▾</span></button>
                    </div>
                    <button class="rb big" data-menu="sortFilter" title="Sort &amp; Filter"><i data-ico="sortFilter"></i><span>Sort &amp;<br>Filter ▾</span></button>
                    <button class="rb big" data-menu="findSelect" title="Find &amp; Select"><i data-ico="find"></i><span>Find &amp;<br>Select ▾</span></button>
                </div>
                <div class="rg-label">Editing</div>
            </div>
        </div>

        <!-- INSERT -->
        <div class="rpanel" data-panel="insert">
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-menu="tableStyles" title="Format the data as a table"><i data-ico="table"></i><span>Table ▾</span></button>
                </div>
                <div class="rg-label">Tables</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="onlinePicture" title="Search free CC0 / CC BY / CC BY-SA pictures"><i data-ico="search"></i><span>Online<br>Pictures</span></button>
                </div>
                <div class="rg-label">Illustrations</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="chartColumn" title="Column Chart"><i data-ico="chartColumn"></i><span>Column</span></button>
                    <button class="rb big" data-cmd="chartLine" title="Line Chart"><i data-ico="chartLine"></i><span>Line</span></button>
                    <button class="rb big" data-cmd="chartPie" title="Pie Chart"><i data-ico="chartPie"></i><span>Pie</span></button>
                    <div class="stack">
                        <button class="rb sm" data-cmd="chartBar" title="Bar Chart"><i data-ico="chartBar"></i><span>Bar</span></button>
                        <button class="rb sm" data-cmd="chartArea" title="Area Chart"><i data-ico="chartArea"></i><span>Area</span></button>
                        <button class="rb sm" data-cmd="chartDoughnut" title="Doughnut Chart"><i data-ico="chartDoughnut"></i><span>Doughnut</span></button>
                    </div>
                    <div class="stack">
                        <button class="rb sm" data-cmd="chartScatter" title="Scatter Chart"><i data-ico="chartScatter"></i><span>Scatter</span></button>
                    </div>
                </div>
                <div class="rg-label">Charts</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <div class="stack">
                        <button class="rb sm" data-cmd="sparkLine" title="Line sparkline in the active cell"><i data-ico="sparkLine"></i><span>Line</span></button>
                        <button class="rb sm" data-cmd="sparkColumn" title="Column sparkline in the active cell"><i data-ico="sparkColumn"></i><span>Column</span></button>
                        <button class="rb sm" data-cmd="sparkWinLoss" title="Win/Loss sparkline in the active cell"><i data-ico="sparkWin"></i><span>Win/Loss</span></button>
                    </div>
                </div>
                <div class="rg-label">Sparklines</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="checkbox" title="Turn cells into checkboxes"><i data-ico="checkbox"></i><span>Checkbox</span></button>
                    <button class="rb big" data-cmd="newNote" title="New Note"><i data-ico="note"></i><span>Note</span></button>
                    <div class="stack">
                        <button class="rb sm" data-cmd="insertDate" title="Today's date (⌘;)"><i data-ico="calendar"></i><span>Date</span></button>
                        <button class="rb sm" data-cmd="insertTime" title="The time now (⌘⇧;)"><i data-ico="clock"></i><span>Time</span></button>
                        <button class="rb sm" data-menu="symbols" title="Symbols"><b class="glyph">Ω</b><span>Symbol ▾</span></button>
                    </div>
                </div>
                <div class="rg-label">Insert</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big kd-btn" data-cmd="keydownCells" title="Keydown Styles"><i data-ico="sparkle"></i><span>Keydown<br>Styles</span></button>
                </div>
                <div class="rg-label">Radii</div>
            </div>
        </div>

        <!-- FORMULAS -->
        <div class="rpanel" data-panel="formulas">
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="insertFunction" title="Insert Function (⇧F3)"><b class="glyph fx">fx</b><span>Insert<br>Function</span></button>
                    <div class="split big">
                        <button class="rb big" data-cmd="autoSum" title="AutoSum"><b class="glyph sigma big">Σ</b><span>AutoSum</span></button>
                        <button class="split-arrow" data-menu="autoSum">▾</button>
                    </div>
                    <div class="stack">
                        <button class="rb sm" data-menu="fnMath"><i data-ico="calc"></i><span>Math ▾</span></button>
                        <button class="rb sm" data-menu="fnStatistical"><i data-ico="chartColumn"></i><span>Statistical ▾</span></button>
                        <button class="rb sm" data-menu="fnLogical"><i data-ico="logic"></i><span>Logical ▾</span></button>
                    </div>
                    <div class="stack">
                        <button class="rb sm" data-menu="fnText"><b class="glyph sm">A</b><span>Text ▾</span></button>
                        <button class="rb sm" data-menu="fnLookup"><i data-ico="find"></i><span>Lookup ▾</span></button>
                        <button class="rb sm" data-menu="fnDate"><i data-ico="calendar"></i><span>Date &amp; Time ▾</span></button>
                    </div>
                </div>
                <div class="rg-label">Function Library</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="showFormulas" title="Show Formulas (⌘`)"><i data-ico="showFormulas"></i><span>Show<br>Formulas</span></button>
                    <button class="rb big" data-cmd="traceRefs" title="Highlight the cells the active formula uses"><i data-ico="trace"></i><span>Trace<br>Precedents</span></button>
                </div>
                <div class="rg-label">Formula Auditing</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="calcNow" title="Calculate Now (F9)"><i data-ico="calc"></i><span>Calculate<br>Now</span></button>
                </div>
                <div class="rg-label">Calculation</div>
            </div>
        </div>

        <!-- DATA -->
        <div class="rpanel" data-panel="data">
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="importCsv" title="Import a CSV file into a new sheet"><i data-ico="import"></i><span>From<br>CSV</span></button>
                    <button class="rb big" data-cmd="exportCsv" title="Save this sheet as CSV"><i data-ico="export"></i><span>To<br>CSV</span></button>
                </div>
                <div class="rg-label">Get &amp; Save Data</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <div class="stack">
                        <button class="rb sm" data-cmd="sortAsc" title="Sort A to Z"><i data-ico="sortAsc"></i><span>Sort A→Z</span></button>
                        <button class="rb sm" data-cmd="sortDesc" title="Sort Z to A"><i data-ico="sortDesc"></i><span>Sort Z→A</span></button>
                    </div>
                    <button class="rb big" data-cmd="customSort" title="Custom Sort"><i data-ico="sortFilter"></i><span>Sort</span></button>
                    <button class="rb big" data-cmd="filter" title="Filter (⌘⇧L)"><i data-ico="funnel"></i><span>Filter</span></button>
                    <div class="stack">
                        <button class="rb sm" data-cmd="clearFilter" title="Clear all filters"><i data-ico="funnelX"></i><span>Clear</span></button>
                        <button class="rb sm" data-cmd="reapplyFilter" title="Reapply the filter"><i data-ico="refresh"></i><span>Reapply</span></button>
                    </div>
                </div>
                <div class="rg-label">Sort &amp; Filter</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="textToColumns" title="Split one column into several"><i data-ico="split"></i><span>Text to<br>Columns</span></button>
                    <button class="rb big" data-cmd="removeDupes" title="Remove Duplicates"><i data-ico="dedupe"></i><span>Remove<br>Duplicates</span></button>
                    <div class="stack">
                        <button class="rb sm" data-cmd="trimSpaces" title="Trim extra spaces from text"><i data-ico="eraser"></i><span>Trim Spaces</span></button>
                        <button class="rb sm" data-cmd="fillSeries" title="Fill a series"><i data-ico="fillDown"></i><span>Series…</span></button>
                        <button class="rb sm" data-cmd="randomFill" title="Fill the selection with random numbers"><i data-ico="dice"></i><span>Random…</span></button>
                    </div>
                </div>
                <div class="rg-label">Data Tools</div>
            </div>
        </div>

        <!-- VIEW -->
        <div class="rpanel" data-panel="view">
            <div class="rgroup">
                <div class="rg-body">
                    <div class="stack">
                        <label class="rcheck"><input type="checkbox" data-pref="gridlines"><span>Gridlines</span></label>
                        <label class="rcheck"><input type="checkbox" data-pref="headings"><span>Headings</span></label>
                        <label class="rcheck"><input type="checkbox" data-pref="formulaBar"><span>Formula Bar</span></label>
                    </div>
                </div>
                <div class="rg-label">Show</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-menu="zoom" title="Zoom"><i data-ico="zoom"></i><span>Zoom ▾</span></button>
                    <button class="rb big" data-cmd="zoom100" title="Zoom to 100%"><b class="glyph sm">100</b><span>100%</span></button>
                    <button class="rb big" data-cmd="zoomSel" title="Zoom to Selection"><i data-ico="zoomSel"></i><span>Zoom to<br>Selection</span></button>
                </div>
                <div class="rg-label">Zoom</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-menu="freeze" title="Freeze Panes"><i data-ico="freeze"></i><span>Freeze<br>Panes ▾</span></button>
                </div>
                <div class="rg-label">Window</div>
            </div>
            <div class="rgroup">
                <div class="rg-body">
                    <div class="stack">
                        <label class="rcheck"><input type="checkbox" data-pref="dark"><span>Dark Mode</span></label>
                        <label class="rcheck"><input type="checkbox" data-pref="anim"><span>Animations</span></label>
                        <label class="rcheck"><input type="checkbox" data-pref="sound"><span>Sounds</span></label>
                    </div>
                    <button class="rb big" data-menu="layout" title="Switch between the Excel and Imbuer Classic layouts"><i data-ico="layout"></i><span>Layout ▾</span></button>
                    <button class="rb big" data-cmd="settings" title="All settings"><i data-ico="gear"></i><span>Settings</span></button>
                </div>
                <div class="rg-label">Appearance</div>
            </div>
        </div>

        <!-- HELP -->
        <div class="rpanel" data-panel="help">
            <div class="rgroup">
                <div class="rg-body">
                    <button class="rb big" data-cmd="help" title="Help Deck"><i data-ico="help"></i><span>Help<br>Deck</span></button>
                    <button class="rb big" data-cmd="shortcuts" title="Keyboard Shortcuts"><i data-ico="keyboard"></i><span>Keyboard<br>Shortcuts</span></button>
                    <button class="rb big" data-cmd="functionList" title="Every function"><b class="glyph fx">fx</b><span>Function<br>List</span></button>
                    <button class="rb big" data-cmd="tour" title="Load a sample workbook"><i data-ico="sparkle"></i><span>Sample<br>Workbook</span></button>
                </div>
                <div class="rg-label">Help</div>
            </div>
        </div>
    </section>

    <!-- Name box + formula bar -->
    <div id="formula-row">
        <div class="name-box-wrap">
            <input id="name-box" spellcheck="false" autocomplete="off" title="Name Box: type a cell like C10 or a range like A1:D5 and press Enter">
