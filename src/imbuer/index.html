<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imbuer - Radii Office</title>
    <script src="https://iconify.design"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="keydown.css">
    <link rel="icon" type="image/svg+xml" href="/imbuer/favicon.svg">
</head>
<body>

    <!-- 3D Liquid-Gel Sidebar Navigation Dock Frame -->
    <nav id="sidebar" class="aero-sidebar">
        <div class="sidebar-brand">
            <h2>Imbuer</h2>
        </div>
        
        <div class="pad-selection-stack">
            <input type="file" id="file-loader-gate" style="display: none;" onchange="importSheetsFile(event)">
            
            <button class="pad-toggle-btn active" onclick="exportSheetsFile()">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v16m8-7.5a15.46 15.46 0 0 0-6.493 5.334L12 18l-1.507-2.166A15.46 15.46 0 0 0 4 10.5M17 22H7" />
                </svg>
                Export .ks
            </button>
            <button class="pad-toggle-btn" onclick="document.getElementById('file-loader-gate').click()">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18V2m8 7.5a15.46 15.46 0 0 1-6.493-5.334L12 2l-1.507 2.166A15.46 15.46 0 0 1 4 9.5M17 22H7" />
                </svg>
                Import .ks
            </button>
            <button class="pad-toggle-btn" onclick="addNewRow()">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14" />
                </svg>
                Add Row
            </button>
            <button class="pad-toggle-btn" onclick="addNewColumn()">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14" />
                </svg>
                Add Column
            </button>
        </div>

        <div class="sidebar-footer-controls">
            <button id="help-trigger-btn" class="sidebar-action-btn" onclick="toggleModal(true)">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M4.929 4.929A10 10 0 0 0 2 12a10.1 10.1 0 0 0 2.929 7.071A10.1 10.1 0 0 0 12 22c2.626 0 5.214-1.072 7.071-2.929A10.1 10.1 0 0 0 22 12A10 10 0 0 0 4.929 4.929" />
                        <path d="M12 13.833c0-2.503 2.75-2.337 2.75-4.84c0-3.324-5.5-3.324-5.5 0M12 17.5v-.625" />
                    </g>
                </svg>
                Help Deck
            </button>
            <button id="settings-trigger-btn" class="sidebar-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none"></path>
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M13.945 10.056a2.75 2.75 0 1 1-3.889 3.888a2.75 2.75 0 0 1 3.889-3.889"></path>
                        <path d="M9.75 4.1c0 1.595-2.027 2.816-3.458 1.991c-2.555-1.359-4.496 2.384-2.239 3.885c1.377.793 1.378 3.2 0 3.994c-2.433 1.457-.212 5.178 2.239 3.873c1.551-.893 3.46.57 3.46 2.174c0 2.678 4.477 2.61 4.477 0c0-1.635 1.879-3.084 3.458-2.174c2.52 1.341 4.69-2.569 2.239-3.873c-1.38-.794-1.378-3.211 0-4.004c2.433-1.457.214-5.178-2.239-3.875c-1.398.807-3.457-.403-3.458-1.99c0-2.845-4.478-2.756-4.478 0"></path>
                    </g>
                </svg>
                Settings
            </button>
        </div>
        <div id="toggle-zone" class="latch-toggle-strip" onclick="toggleSidebar()">
            <svg id="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.5 19a18 18 0 0 0-7-7a18 18 0 0 0 7-7" />
            </svg>
        </div>
    </nav>

    <!-- Main Viewport Area -->
    <main class="workspace-viewport-wrapper">
        <!-- Imbuer Floating Selection Toolbar -->
        <div id="aero-selection-toolbar" class="aero-floating-bar">
            <button class="style-bar-btn" data-style="bold" title="Bold"><b>B</b></button>
            <button class="style-bar-btn" data-style="italic" title="Italic"><i>I</i></button>
            <button class="style-bar-btn" data-style="underline" title="Underline"><u>U</u></button>
            <button class="style-bar-btn" data-style="strike" title="Strikethrough"><s>S</s></button>
            <button class="style-bar-btn" data-style="code" title="Inline Code">&lt;/&gt;</button>
            <div class="style-bar-divider"></div>

            <!-- Dropdown 1: Gel Orbs Grid Palette -->
            <div class="aero-dropdown">
                <button class="style-bar-btn dropdown-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.929 4.929A10 10 0 0 0 2 12a10.1 10.1 0 0 0 2.929 7.071A10.1 10.1 0 0 0 12 22c2.626 0 5.214-1.072 7.071-2.929A10.1 10.1 0 0 0 22 12A10 10 0 0 0 4.929 4.929"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 8.5a18 18 0 0 0-7 7a18 18 0 0 0-7-7"/></svg>
                </button>
                <div class="dropdown-menu highlight-grid-menu">
                    <button class="color-swatch-item gel-y" data-class="gel-orb gel-y" title="Yellow"></button>
                    <button class="color-swatch-item gel-o" data-class="gel-orb gel-o" title="Orange"></button>
                    <button class="color-swatch-item gel-r" data-class="gel-orb gel-r" title="Red"></button>
                    <button class="color-swatch-item gel-mg" data-class="gel-orb gel-mg" title="Magenta"></button>
                    <button class="color-swatch-item gel-p" data-class="gel-orb gel-p" title="Pink"></button>
                    <button class="color-swatch-item gel-v" data-class="gel-orb gel-v" title="Purple"></button>
                    <button class="color-swatch-item gel-b" data-class="gel-orb gel-b" title="Blue"></button>
                    <button class="color-swatch-item gel-c" data-class="gel-orb gel-c" title="Cyan"></button>
                    <button class="color-swatch-item gel-aq" data-class="gel-orb gel-aq" title="Aqua"></button>
                    <button class="color-swatch-item gel-g" data-class="gel-orb gel-g" title="Green"></button>
                    <button class="color-swatch-item gel-lm" data-class="gel-orb gel-lm" title="Lime"></button>
                    <button class="color-swatch-item gel-sl" data-class="gel-orb gel-sl" title="Slate"></button>
                </div>
            </div>

            <!-- Dropdown 2: Highlighters Grid Palette -->
            <div class="aero-dropdown">
                <button class="style-bar-btn dropdown-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="11" fill="currentColor"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 8.5a18 18 0 0 0-7 7a18 18 0 0 0-7-7"/></svg>
                </button>
                <div class="dropdown-menu highlight-grid-menu chip-grid-menu">
                    <button class="chip-swatch-item gel-chip-yellow" data-class="gel-bubble-chip gel-chip-yellow" title="Yellow"></button>
                    <button class="chip-swatch-item gel-chip-orange" data-class="gel-bubble-chip gel-chip-orange" title="Orange"></button>
                    <button class="chip-swatch-item gel-chip-red" data-class="gel-bubble-chip gel-chip-red" title="Red"></button>
                    <button class="chip-swatch-item gel-chip-pink" data-class="gel-bubble-chip gel-chip-pink" title="Pink"></button>
                    <button class="chip-swatch-item gel-chip-purple" data-class="gel-bubble-chip gel-chip-purple" title="Purple"></button>
                    <button class="chip-swatch-item gel-chip-blue" data-class="gel-bubble-chip gel-chip-blue" title="Blue"></button>
                    <button class="chip-swatch-item gel-chip-cyan" data-class="gel-bubble-chip gel-chip-cyan" title="Cyan"></button>
                    <button class="chip-swatch-item gel-chip-turquoise" data-class="gel-bubble-chip gel-chip-turquoise" title="Turquoise"></button>
                    <button class="chip-swatch-item gel-chip-teal" data-class="gel-bubble-chip gel-chip-teal" title="Teal"></button>
                    <button class="chip-swatch-item gel-chip-green" data-class="gel-bubble-chip gel-chip-green" title="Green"></button>
                    <button class="chip-swatch-item gel-chip-lime" data-class="gel-bubble-chip gel-chip-lime" title="Lime"></button>
                    <button class="chip-swatch-item gel-chip-gold" data-class="gel-bubble-chip gel-chip-gold" title="Gold"></button>
                    <button class="chip-swatch-item gel-chip-slate" data-class="gel-bubble-chip gel-chip-slate" title="Slate"></button>
                    <button class="chip-swatch-item gel-chip-fog" data-class="gel-bubble-chip gel-chip-fog" title="Fog"></button>
                    <button class="chip-swatch-item gel-chip-white" data-class="gel-bubble-chip gel-chip-white" title="White"></button>
                    <button class="chip-swatch-item gel-chip-black" data-class="gel-bubble-chip gel-chip-black" title="Black"></button>
                </div>
            </div>

            <!-- Dropdown 3: Other Styles Grid Palette -->
            <div class="aero-dropdown">
                <button class="style-bar-btn dropdown-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.078 22c1.248-5.166 2.762-6.777 6.922-8.182c-4.371-1.476-5.733-3.267-6.922-8.181c-1.25 5.165-2.765 6.775-6.925 8.18c4.367 1.475 5.737 3.279 6.924 8.183M5.846 11.091C6.414 8.402 7.514 7.19 9.69 6.546C7.514 5.902 6.414 4.689 5.847 2C5.302 4.572 4.274 5.872 2 6.544c2.177.645 3.277 1.858 3.846 4.547"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 8.5a18 18 0 0 0-7 7a18 18 0 0 0-7-7"/></svg>
                </button>
                <div class="dropdown-menu highlight-grid-menu effect-grid-menu">
                    <button class="effect-swatch-item gel-chip-waterdrop" data-class="gel-chip-waterdrop">WD</button>
                    <button class="effect-swatch-item gel-chip-solarflare" data-class="gel-chip-solarflare">SF</button>
                    <button class="effect-swatch-item gel-chip-aurorawave" data-class="gel-chip-aurorawave">AW</button>
                    <button class="effect-swatch-item effect-mercury-pearl" data-class="effect-mercury-pearl">MP</button>
                    <button class="effect-swatch-item effect-prism-refract" data-class="effect-prism-refract">PG</button>
                    <button class="effect-swatch-item effect-screen-cavity" data-class="effect-screen-cavity">CB</button>
                    <button class="effect-swatch-item effect-sunlight-ray" data-class="effect-sunlight-ray">SR</button>
                    <button class="effect-swatch-item effect-abyssal-plate" data-class="effect-abyssal-plate">OA</button>
                    <button class="effect-swatch-item effect-metallic-mesh" data-class="effect-metallic-mesh">MM</button>
                    <button class="effect-swatch-item effect-fluid-expand" data-class="effect-fluid-expand">FE</button>
                    <button class="effect-swatch-item effect-pearl-orb" data-class="effect-pearl-orb">PO</button>
                    <button class="effect-swatch-item effect-lens-flare" data-class="effect-lens-flare">LF</button>
                </div>
            </div>

            <!-- Dropdown 4: Megachips, Badges & Custom Tags Tray -->
            <div class="aero-dropdown">
                <button class="style-bar-btn dropdown-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22V11.93M2 7.036C5.643 5.944 8.843 4.07 12 2c0 0 3.555 1.7 5 2.447l5 2.59c0 3.062-.06 9.467-.06 9.467C18.886 18.807 15.625 20.726 12 22l-9.94-5.497S2 10.1 2 7.036m10 4.894L7 9.483m5 2.447c3.62-1.047 6.91-2.764 10-4.894M7 9.484c3.625-1.101 6.914-2.865 10-5.037M2 7.037l5 2.447m0 0v2.446"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 8.5a18 18 0 0 0-7 7a18 18 0 0 0-7-7"/></svg>
                </button>
                <div class="dropdown-menu highlight-grid-menu effect-grid-menu" style="grid-template-columns: repeat(4, 1fr) !important; min-width: 200px !important;">
                    <button class="effect-swatch-item badge-frame-sky" data-class="aero-glass-badge-chip badge-frame-sky" title="Sky Badge"></button>
                    <button class="effect-swatch-item badge-frame-emerald" data-class="aero-glass-badge-chip badge-frame-emerald" title="Emerald Badge"></button>
                    <button class="effect-swatch-item badge-frame-orange" data-class="aero-glass-badge-chip badge-frame-orange" title="Orange Badge"></button>
                    <button class="effect-swatch-item badge-frame-crimson" data-class="aero-glass-badge-chip badge-frame-crimson" title="Crimson Badge"></button>
                    <button class="effect-swatch-item badge-frame-amethyst" data-class="aero-glass-badge-chip badge-frame-amethyst" title="Amethyst Badge"></button>
                    <button class="effect-swatch-item badge-frame-gold" data-class="aero-glass-badge-chip badge-frame-gold" title="Gold Badge"></button>

                    <button class="effect-swatch-item plasma-cyan" data-class="megachip-plasma plasma-cyan" title="Cyan Plasma"></button>
                    <button class="effect-swatch-item plasma-orange" data-class="megachip-plasma plasma-orange" title="Orange Plasma"></button>
                    <button class="effect-swatch-item plasma-crimson" data-class="megachip-plasma plasma-crimson" title="Crimson Plasma"></button>
                    <button class="effect-swatch-item plasma-lime" data-class="megachip-plasma plasma-lime" title="Lime Plasma"></button>

                    <button class="effect-swatch-item bracket-blue" data-class="megachip-glass-bracket bracket-blue" title="Blue Bracket"></button>
                    <button class="effect-swatch-item bracket-amethyst" data-class="megachip-glass-bracket bracket-amethyst" title="Amethyst Bracket"></button>
                    <button class="effect-swatch-item bracket-fuchsia" data-class="megachip-glass-bracket bracket-fuchsia" title="Fuchsia Bracket"></button>
                    <button class="effect-swatch-item bracket-amber" data-class="megachip-glass-bracket bracket-amber" title="Amber Bracket"></button>

                    <button class="effect-swatch-item circuit-slate" data-class="megachip-circuit-node circuit-slate" title="Slate Circuit"></button>
                    <button class="effect-swatch-item circuit-teal" data-class="megachip-circuit-node circuit-teal" title="Teal Circuit"></button>
                    <button class="effect-swatch-item circuit-gold" data-class="megachip-circuit-node circuit-gold" title="Gold Circuit"></button>
                    <button class="effect-swatch-item circuit-ruby" data-class="megachip-circuit-node circuit-ruby" title="Ruby Circuit"></button>

                    <button class="effect-swatch-item droplet-amber" data-class="droplet-amber" title="Amber Droplet"></button>
                    <button class="effect-swatch-item droplet-crimson" data-class="droplet-crimson" title="Crimson Droplet"></button>
                    <button class="effect-swatch-item droplet-fuchsia" data-class="droplet-fuchsia" title="Fuchsia Droplet"></button>
                    <button class="effect-swatch-item droplet-amethyst" data-class="droplet-amethyst" title="Amethyst Droplet"></button>
                    <button class="effect-swatch-item droplet-tangerine" data-class="droplet-tangerine" title="Tangerine Droplet"></button>
                    <button class="effect-swatch-item droplet-slate" data-class="droplet-slate" title="Slate Droplet"></button>

                    <button class="effect-swatch-item tag-chip-a" data-class="aero-tag-chip tag-chip-a" title="Tag A"></button>
                    <button class="effect-swatch-item tag-chip-g" data-class="aero-tag-chip tag-chip-g" title="Tag G"></button>
                    <button class="effect-swatch-item tag-chip-o" data-class="aero-tag-chip tag-chip-o" title="Tag O"></button>
                    <button class="effect-swatch-item tag-chip-r" data-class="aero-tag-chip tag-chip-r" title="Tag R"></button>
                    <button class="effect-swatch-item tag-chip-pr" data-class="aero-tag-chip tag-chip-pr" title="Tag PR"></button>
                    <button class="effect-swatch-item tag-chip-pk" data-class="aero-tag-chip tag-chip-pk" title="Tag PK"></button>
                    <button class="effect-swatch-item tag-chip-y" data-class="aero-tag-chip tag-chip-y" title="Tag Y"></button>
                    <button class="effect-swatch-item tag-chip-sl" data-class="aero-tag-chip tag-chip-sl" title="Tag SL"></button>
                </div>
            </div>
        </div>
        <div id="top-format-bar" class="sheets-toolbar aero-format-ribbon">
            <!-- 1. Color Picker Button & Popup -->
            <div class="color-picker-container">
                <button id="color-picker-btn" class="style-tool-btn" onclick="toggleColorPopup(event)" title="Cell Colors & Borders">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 22C6.553 22 2 17.447 2 12S6.553 2 12 2c5.006 0 10 3.695 10 9c0 4.15-4.035 4.01-7.25 5c-3.25 1-1.57 2.686-.757 4.093C14.805 21.5 13.076 22 12 22"/><path d="M6 14c0 .5.5 1.5 1 1.802M12.783 6s-1.283 0-2.033.345M7.06 8C6.5 8.5 6 9.768 6 9.768m11.6-.143S17 8.5 16.167 8.143"/></g></svg>
                </button>

                <!-- Floating Glass Palette Menu Popup -->
                <div id="aero-color-popup" class="aero-palette-menu">
                    <div class="palette-header">Cell Fill & Outline</div>
                    
                    <div class="palette-section">
                        <label>Fill Color:</label>
                        <div class="preset-row">
                            <span class="color-swatch" style="background:#ffffff;" onclick="applyCellStyles('#ffffff', null)"></span>
                            <span class="color-swatch" style="background:#bae6fd;" onclick="applyCellStyles('#bae6fd', null)"></span>
                            <span class="color-swatch" style="background:#a7f3d0;" onclick="applyCellStyles('#a7f3d0', null)"></span>
                            <span class="color-swatch" style="background:#fef08a;" onclick="applyCellStyles('#fef08a', null)"></span>
                            <span class="color-swatch" style="background:#fca5a5;" onclick="applyCellStyles('#fca5a5', null)"></span>
                            <span class="color-swatch" style="background:#e9d5ff;" onclick="applyCellStyles('#e9d5ff', null)"></span>
                            
                            <label class="custom-picker-wrapper" title="Custom Fill Color">
                                <input type="color" onchange="applyCellStyles(this.value, null)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11A7 7 0 0 1 5 11c0-4.5 7-9 7-9s7 4.5 7 9Z"/></svg>
                            </label>
                        </div>
                    </div>

                    <div class="palette-section">
                        <label>Outline Color:</label>
                        <div class="preset-row">
                            <span class="color-swatch" style="background:#cbd5e1;" onclick="applyCellStyles(null, '#cbd5e1')"></span>
                            <span class="color-swatch" style="background:#0284c7;" onclick="applyCellStyles(null, '#0284c7')"></span>
                            <span class="color-swatch" style="background:#059669;" onclick="applyCellStyles(null, '#059669')"></span>
                            <span class="color-swatch" style="background:#ca8a04;" onclick="applyCellStyles(null, '#ca8a04')"></span>
                            <span class="color-swatch" style="background:#dc2626;" onclick="applyCellStyles(null, '#dc2626')"></span>
                            <span class="color-swatch" style="background:#7e22ce;" onclick="applyCellStyles(null, '#7e22ce')"></span>
                            
                            <label class="custom-picker-wrapper" title="Custom Border Color">
                                <input type="color" onchange="applyCellStyles(null, this.value)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11A7 7 0 0 1 5 11c0-4.5 7-9 7-9s7 4.5 7 9Z"/></svg>
                            </label>
                        </div>
                    </div>

                    <div class="palette-footer">
                        <button class="reset-style-btn" onclick="applyCellStyles('#ffffff', '#cbd5e1')">Reset Style</button>
                    </div>
                </div>
            </div>

            <!-- 2. Chart Generator Button -->
            <button class="style-tool-btn" onclick="generateAeroChart()" title="Generate Aero Chart from Selected Column">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.3em" height="1.3em" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18M18 17V9m-5 8v-5m-5 5v-3"/>
                </svg>
            </button>

            <span class="ribbon-separator"></span>

            <!-- 3. Font Family Dropdown -->
            <select class="format-control" id="sheet-font-family" onchange="applyCellFontFamily(this.value)">
                <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                <option value="Roboto, sans-serif">Roboto</option>
                <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
                <option value="'Comic Neue', cursive">Comic Neue</option>
            </select>

            <!-- 4. Font Size Dropdown -->
            <select class="format-control" id="sheet-font-size" onchange="applyCellFontSize(this.value)">
                <option value="11px">Small</option>
                <option value="13px" selected>Normal</option>
                <option value="16px">Large</option>
                <option value="20px">Huge</option>
            </select>

            <span class="ribbon-separator"></span>

            <!-- 5. Text Color Picker -->
            <label class="color-picker-label" title="Text Color">
                🎨 <input type="color" id="sheet-text-color" value="#1e293b" onchange="applyCellTextColor(this.value)">
            </label>

            <!-- 6. Highlight / Background Color Picker -->
            <label class="color-picker-label" title="Highlight Color">
                🖌️ <input type="color" id="sheet-bg-color" value="#ffffff" onchange="applyCellStyles(this.value, null)">
            </label>

            <span class="ribbon-separator"></span>

            <!-- 7. Formula Input Wrapper -->
            <div class="formula-bar-wrapper">
                <span class="formula-badge" id="selected-cell-label">A1</span>
                <input type="text" id="formula-input" placeholder="Enter value or formula (e.g., =SUM(A1:A3))" oninput="updateCellFromFormula(this.value)">
            </div>
        </div>

        <!-- Dynamic Glass Chart Container -->
        <div id="chart-viewport" class="aero-chart-card" style="display: none;">
            <div class="chart-header">
                <div class="chart-nav-cluster">
                    <button class="chart-nav-btn" onclick="cycleChartColumn(-1)" title="Previous Column">
                        <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M15.5 19a18 18 0 0 0-7-7a18 18 0 0 0 7-7"/></svg>
                    </button>
                    <button class="chart-nav-btn" onclick="cycleChartColumn(1)" title="Next Column">
                        <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M8.5 19a18 18 0 0 1 7-7a18 18 0 0 1-7-7"/></svg>
                    </button>
                    <span id="chart-title-text">COLUMN A DATA</span>
                </div>
                <button class="chart-close-orb" onclick="closeChart()">✕</button>
            </div>
            <div id="chart-bar-container" class="chart-bars-wrapper">
                <!-- Dynamic 3D bars rendered via JS -->
            </div>
        </div>

        <div id="spreadsheet-container">
            <table id="aero-grid-table">
                <thead>
                    <tr id="table-header-row">
                        <th class="corner-header"></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamically generated rows -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Help Container -->
    <div id="aero-modal-overlay" class="modal-blur-gate">
        <div id="aero-dialog-box" class="embossed-dialogue-chassis">
            <div class="dialog-header">
                <h3>AERO SHEETS REFERENCE SPECS</h3>
                <div id="dialog-close-btn" onclick="toggleModal(false)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M18.5 5.5L12 12m0 0l-6.5 6.5M12 12L5.5 5.5M12 12l6.5 6.5" />
                    </svg>
                </div>
            </div>
            <div class="dialog-body-scroll">
                <div class="help-card">
                    <b>=SUM(range)</b> <span>Calculates total sum of cell ranges (e.g., A1:A5)</span><br>
                    <b>=AVG(range)</b> Calculates arithmetic mean of cell ranges<br>
                    <b>Cell Styling</b> Click the drop icon in the top toolbar to style cell background and borders!
                </div>
            </div>
            <div class="dialog-footer">
                <button id="dialog-confirm-btn" class="dialog-confirm-orb" onclick="toggleModal(false)">DISMISS DECK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
