<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="Helvetica, Arial, sans-serif">
  <title>Venn diagram of A = {1, 2, 3, 4} and B = {3, 4, 5, 6} (OpenDB, CC0)</title>
  <rect width="480" height="330" fill="#f8fbff"/>
  <rect x="20" y="20" width="440" height="250" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="46" font-size="17" font-weight="bold" fill="#475569">U</text>
  <circle cx="190" cy="145" r="95" fill="#60a5fa" fill-opacity="0.45" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="290" cy="145" r="95" fill="#f472b6" fill-opacity="0.45" stroke="#be185d" stroke-width="3"/>
  <text x="120" y="65" font-size="22" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="350" y="65" font-size="22" font-weight="bold" fill="#be185d">B</text>
  <g font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <text x="140" y="135">1</text><text x="150" y="180">2</text>
    <text x="240" y="135">3</text><text x="240" y="180">4</text>
    <text x="340" y="135">5</text><text x="330" y="180">6</text>
    <text x="420" y="240" fill="#64748b">7</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#0f172a">
    <text x="240" y="296">A ∩ B = {3, 4}   ·   A ∪ B = {1, 2, 3, 4, 5, 6}</text>
    <text x="240" y="318">A ∖ B = {1, 2}   ·   U = {1, 2, 3, 4, 5, 6, 7}</text>
  </g>
</svg>
