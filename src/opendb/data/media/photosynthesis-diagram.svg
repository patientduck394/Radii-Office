<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Helvetica, Arial, sans-serif">
  <title>Photosynthesis in a leaf: light, water and carbon dioxide in; glucose and oxygen out (OpenDB, CC0)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#f0f9ff"/></linearGradient>
  </defs>
  <rect width="520" height="360" fill="url(#sky)"/>
  <circle cx="70" cy="62" r="34" fill="#fde047" stroke="#eab308" stroke-width="3"/>
  <text x="70" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#a16207">Sunlight</text>
  <!-- the leaf -->
  <path d="M150 210 C 200 110, 340 100, 400 160 C 340 250, 210 270, 150 210 Z" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
  <path d="M150 210 C 230 190, 320 170, 400 160" fill="none" stroke="#15803d" stroke-width="3"/>
  <path d="M120 240 L150 210" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
  <text x="285" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">chloroplasts</text>
  <g stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M100 85 L205 160" stroke="#eab308"/>
    <path d="M478 66 L382 142" stroke="#64748b"/>
    <path d="M120 330 L120 250" stroke="#2563eb"/>
    <path d="M370 200 L460 250" stroke="#ef4444"/>
    <path d="M275 128 L230 52" stroke="#0ea5e9"/>
  </g>
  <g font-size="16" font-weight="bold">
    <text x="508" y="52" text-anchor="end" fill="#334155">Carbon dioxide (CO₂) in</text>
    <text x="132" y="320" fill="#1d4ed8">Water (H₂O) in, from the roots</text>
    <text x="508" y="276" text-anchor="end" fill="#b91c1c">Glucose (sugar) made</text>
    <text x="225" y="40" text-anchor="end" fill="#0369a1">Oxygen (O₂) out</text>
  </g>
</svg>
