<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Helvetica, Arial, sans-serif">
  <title>The planets of the Solar System in order, not to scale (OpenDB, CC0)</title>
  <defs><radialGradient id="sun" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffcc33"/><stop offset="1" stop-color="#ff8a00"/></radialGradient></defs>
  <rect width="900" height="260" fill="#050b1f"/>
  <g fill="#fff" opacity=".7"><circle cx="300" cy="30" r="1.5"/><circle cx="520" cy="220" r="1.2"/><circle cx="700" cy="40" r="1.4"/><circle cx="860" cy="200" r="1.2"/><circle cx="420" cy="60" r="1"/><circle cx="610" cy="120" r="1"/></g>
  <circle cx="-20" cy="130" r="120" fill="url(#sun)"/>
  <g stroke="#ffffff" stroke-opacity=".25">
    <circle cx="140" cy="130" r="6" fill="#9e9e9e"/>
    <circle cx="200" cy="130" r="11" fill="#e8c27a"/>
    <circle cx="265" cy="130" r="12" fill="#3b82f6"/>
    <circle cx="325" cy="130" r="8" fill="#d0492d"/>
    <circle cx="430" cy="130" r="40" fill="#d8a46b"/>
    <ellipse cx="560" cy="130" rx="58" ry="10" fill="none" stroke="#e9d39b" stroke-opacity=".9" stroke-width="5"/>
    <circle cx="560" cy="130" r="33" fill="#e6c88a"/>
    <circle cx="680" cy="130" r="22" fill="#8fe3e8"/>
    <circle cx="790" cy="130" r="21" fill="#3f63e6"/>
  </g>
  <g fill="#e2e8f0" font-size="13" text-anchor="middle">
    <text x="140" y="200">Mercury</text><text x="200" y="200">Venus</text><text x="265" y="200">Earth</text><text x="325" y="200">Mars</text>
    <text x="430" y="200">Jupiter</text><text x="560" y="200">Saturn</text><text x="680" y="200">Uranus</text><text x="790" y="200">Neptune</text>
  </g>
</svg>
