<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" font-family="Helvetica, Arial, sans-serif">
  <title>Squares on a 3-4-5 right triangle (OpenDB, CC0)</title>
  <rect width="420" height="420" fill="#f8fbff"/>
  <!-- triangle with legs 3 (vertical) and 4 (horizontal), 30px per unit -->
  <g transform="translate(150 210)">
    <polygon points="0,0 120,0 0,-90" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
    <rect x="0" y="-10" width="10" height="10" fill="none" stroke="#92400e" stroke-width="2"/>
    <!-- square on a = 3 (left of vertical leg) -->
    <rect x="-90" y="-90" width="90" height="90" fill="#93c5fd" stroke="#1e3a8a" stroke-width="3"/>
    <!-- square on b = 4 (below horizontal leg) -->
    <rect x="0" y="0" width="120" height="120" fill="#86efac" stroke="#14532d" stroke-width="3"/>
    <!-- square on c = 5 on the hypotenuse -->
    <polygon points="0,-90 120,0 210,-120 90,-210" fill="#f9a8d4" stroke="#831843" stroke-width="3"/>
    <g font-size="22" font-weight="bold" text-anchor="middle">
      <text x="-45" y="-38" fill="#1e3a8a">9</text>
      <text x="60" y="68" fill="#14532d">16</text>
      <text x="105" y="-98" fill="#831843">25</text>
      <text x="-14" y="-40" fill="#92400e" font-size="18">3</text>
      <text x="60" y="-8" fill="#92400e" font-size="18">4</text>
      <text x="52" y="-52" fill="#92400e" font-size="18">5</text>
    </g>
  </g>
  <text x="210" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">9 + 16 = 25</text>
</svg>
