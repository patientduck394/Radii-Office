       id="tspan12">9</tspan></text>
  <text
     x="182"
     y="398"
     text-anchor="middle"
     font-size="20px"
     font-weight="bold"
     fill="#0f172a"
     id="text13">+</text>
  <text
     x="204"
     y="400"
     text-anchor="middle"
     font-size="20px"
     font-weight="bold"
     fill="#0f172a"
     id="text14"
     style="fill:#34be66;fill-opacity:1">16</text>
  <text
     x="226"
     y="400"
     text-anchor="middle"
