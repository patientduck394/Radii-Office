<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif">
  <title>An example of the DORFic style: daylight, orange, red, futurism and graphic design (OpenDB, CC0)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.55" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="0.5" stop-color="#ff7a00"/><stop offset="1" stop-color="#d94f00"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="0.5" stop-color="#e3261b"/><stop offset="1" stop-color="#a5130c"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#b8c0c8"/></linearGradient>
  </defs>
  <!-- daylight -->
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="500" cy="80" r="120" fill="url(#sun)"/>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
    <line x1="500" y1="80" x2="640" y2="20"/><line x1="500" y1="80" x2="640" y2="120"/><line x1="500" y1="80" x2="380" y2="0"/>
  </g>
  <!-- factory skyline -->
  <g fill="#c2410c" fill-opacity="0.55">
    <path d="M0 300 V250 H50 V215 H70 V250 H110 L150 225 V250 L190 225 V250 L230 225 V250 H270 V200 H290 V250 H340 V300 Z"/>
    <rect x="58" y="180" width="8" height="35"/><rect x="278" y="165" width="8" height="35"/>
  </g>
  <!-- bold graphic stripes -->
  <path d="M-20 330 L660 250 L660 300 L-20 380 Z" fill="url(#orange)"/>
  <path d="M-20 360 L660 280 L660 300 L-20 380 Z" fill="url(#red)"/>
  <path d="M-20 330 L660 250 L660 262 L-20 342 Z" fill="url(#gloss)"/>
  <!-- futuristic glossy panel -->
  <g transform="translate(40 40)">
    <rect width="300" height="150" rx="22" fill="url(#steel)" stroke="#8a949e" stroke-width="2"/>
    <rect x="12" y="12" width="276" height="56" rx="14" fill="url(#orange)" stroke="#b34100" stroke-width="2"/>
    <rect x="12" y="12" width="276" height="26" rx="13" fill="url(#gloss)"/>
    <text x="150" y="50" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="6" fill="#ffffff">DORFic</text>
    <!-- chevrons -->
    <g fill="url(#red)">
      <path d="M22 86 h22 l14 22 l-14 22 h-22 l14 -22 z"/><path d="M58 86 h22 l14 22 l-14 22 h-22 l14 -22 z"/><path d="M94 86 h22 l14 22 l-14 22 h-22 l14 -22 z"/>
    </g>
    <!-- gauge -->
    <g transform="translate(205 110)">
      <circle r="32" fill="#ffffff" stroke="#8a949e" stroke-width="3"/>
      <path d="M-24 10 A26 26 0 0 1 24 10" fill="none" stroke="#ff7a00" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="16" y2="-16" stroke="#e3261b" stroke-width="4" stroke-linecap="round"/>
      <circle r="5" fill="#a5130c"/>
    </g>
    <circle cx="268" cy="94" r="7" fill="#e3261b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="268" cy="124" r="7" fill="#ff7a00" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- sterile lab flask -->
  <g transform="translate(470 150)">
    <path d="M-14 0 h28 v34 l38 70 a12 12 0 0 1 -10 18 h-84 a12 12 0 0 1 -10 -18 l38 -70 z" fill="#ffffff" fill-opacity="0.85" stroke="#8a949e" stroke-width="3"/>
    <path d="M-36 82 h72 l12 22 a12 12 0 0 1 -10 18 h-76 a12 12 0 0 1 -10 -18 z" fill="url(#orange)"/>
    <rect x="-18" y="-8" width="36" height="10" rx="4" fill="url(#steel)" stroke="#8a949e" stroke-width="2"/>
    <circle cx="-8" cy="96" r="4" fill="#fff3b0"/><circle cx="10" cy="104" r="3" fill="#fff3b0"/>
  </g>
</svg>
