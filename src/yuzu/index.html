<!DOCTYPE html>
<html lang="en">
<head>
    <script src="radii-file.js?v=20261208a"></script>
    <script>RadiiFile.scope(/^(yuzu_mail_v1$)/);</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuzu - Radii Office</title>
    <meta name="description" content="Yuzu: an email app with an inbox, folders, search and Keydown in every message, in Radii Office's New ribbon look or the original Yuzu Classic look!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <link rel="stylesheet" href="../phosphor/keydown.css?v=20261222q">
    <link rel="stylesheet" href="../writeout/annotate-hl.css?v=20261219h">
    <link rel="stylesheet" href="style.css?v=20261220c">
    <link rel="stylesheet" href="office-shell.css?v=20261221c">
    <link rel="stylesheet" href="yuzu-office.css?v=20261214a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="/offline.js?v=20261132g" defer></script>
    <script src="/phone-drawer.js?v=20261201k" defer></script>
</head>
<body>

    <nav class="yz-sidebar">
        <div class="yz-brand">
            <img src="favicon.svg" alt="" width="26" height="26"><h2>Yuzu</h2>
        </div>

        <div class="yz-account" id="yz-account"></div>

        <button type="button" class="yz-compose-btn" id="yz-compose-btn">✎ Compose</button>

        <div class="yz-folders" id="yz-folders"></div>

        <div class="yz-sidebar-actions">
            <button type="button" class="yz-btn" id="yz-sync-btn">🔄 Sync mail</button>
            <button type="button" class="yz-btn" id="yz-export-btn">⬇ Export .YZ</button>
            <button type="button" class="yz-btn" id="yz-import-btn">📂 Import .YZ</button>
            <input type="file" id="yz-import-input" accept=".yz,.json" hidden>
        </div>
    </nav>

    <main class="yz-main">
        <div class="yz-search-bar">
            <svg viewBox="0 0 24 24" class="yz-search-icon" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" id="yz-search" placeholder="Search mail…" aria-label="Search mail">
        </div>
        <div class="yz-workspace">
            <section class="yz-list-pane">
                <div class="yz-list-head"><span id="yz-list-title">Inbox</span><span class="yz-list-count" id="yz-list-count"></span></div>
                <div class="yz-list" id="yz-list"></div>
            </section>
            <section class="yz-reading-pane" id="yz-reading"></section>
        </div>
    </main>

    <div class="yz-toast" id="yz-toast" role="status"></div>

    <script src="../phosphor/keydown.js?v=20261222q"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script src="../writeout/latex.js?v=20261207d"></script>
    <script src="../writeout/keydown-next.js?v=20261219i"></script>
    <script src="office-shell.js?v=20261219k"></script>
    <script src="docs-library.js?v=20261210r"></script>
    <!-- Yuzu itself: the app, then its ribbon, in order! -->
    <script src="config.js?v=20261205d"></script>
    <script src="mail.js?v=20261219g"></script>
    <script src="app.js?v=20261222q"></script>
    <script src="office.js?v=20261208f"></script>
    <script src="kdnext-auto.js?v=20261207d"></script>
</body>
</html>
